[workspace]
members = [
    "crates/mellowdeck-cli",
    "crates/mellowdeck-core",
    "crates/mellowdeck-platform",
    "crates/mellowdeck-playback",
    "crates/mellowdeck-player-host",
    "crates/mellowdeck-spotify",
    "crates/mellowdeck-storage",
    "xtask",
]
default-members = ["crates/mellowdeck-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mellowdeck/lspotify"

[workspace.dependencies]
base64 = "=0.22.1"
crossterm = "=0.28.1"
gpui = "=0.2.2"
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
open = "=5.4.4"
rand = "=0.9.2"
ratatui = "=0.29.0"
ratatui-image = "=8.0.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.144"
sha2 = "=0.10.9"
tempfile = "=3.22.0"
thiserror = "=2.0.16"
tracing = "=0.1.41"
url = "=2.5.7"
wry = "=0.57.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.metadata.mellowdeck]
product-name = "Mellowdeck"
oauth-redirect-uri = "http://127.0.0.1:43821/callback"
