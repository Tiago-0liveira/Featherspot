name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release workspace
        run: cargo build --workspace --release --locked

  release-readiness:
    name: Release readiness
    needs:
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            Cargo.toml
            Cargo.lock
            install.ps1
            install.cmd
            packaging/windows/wix/Package.wxs
            scripts/generate-windows-sboms.ps1
          )

          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "::error::Missing release input: $path"
              exit 1
            }
          done

          git fetch --tags --force

          latest="$(
            git tag --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"

            if (( patch < 65535 )); then
              ((patch += 1))
            elif (( minor < 255 )); then
              ((minor += 1))
              patch=0
            else
              ((major += 1))
              minor=0
              patch=0
            fi

            if (( major > 255 )); then
              echo "::error::MSI version range exhausted."
              exit 1
            fi

            next="v${major}.${minor}.${patch}"
          fi

          echo "Latest release: ${latest:-none}"
          echo "Next release:   $next"

  pr-gate:
    name: PR Gate
    if: always()
    needs:
      - build
      - release-readiness
    runs-on: ubuntu-24.04

    steps:
      - name: Require every PR check to pass
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release-readiness.result }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_RESULT" != "success" || "$RELEASE_RESULT" != "success" ]]; then
            echo "::error::PR checks did not all pass."
            echo "Build: $BUILD_RESULT"
            echo "Release readiness: $RELEASE_RESULT"
            exit 1
          fi

          echo "All PR checks passed."
