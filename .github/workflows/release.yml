name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Choose release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Choose next release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          release_sha="$(git rev-parse HEAD)"

          existing="$(
            git tag --points-at HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              || true
          )"

          if [[ -n "$existing" ]]; then
            tag="$existing"
          else
            latest="$(
              git tag --list 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"

            if [[ -z "$latest" ]]; then
              tag="v0.1.0"
            else
              IFS='.' read -r major minor patch <<< "${latest#v}"

              if (( patch < 65535 )); then
                ((patch += 1))
              elif (( minor < 255 )); then
                ((minor += 1))
                patch=0
              else
                ((major += 1))
                minor=0
                patch=0
              fi

              if (( major > 255 )); then
                echo "::error::MSI version range exhausted."
                exit 1
              fi

              tag="v${major}.${minor}.${patch}"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

          echo "Release tag: $tag"
          echo "Release SHA: $release_sha"

  build:
    name: Release build / ${{ matrix.name }}
    if: github.event.pull_request.merged == true
    needs:
      - version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            id: linux
            os: ubuntu-24.04

          - name: macOS
            id: macos
            os: macos-latest

          - name: Windows
            id: windows
            os: windows-latest

    env:
      LSPOTIFY_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Linux release
        if: matrix.id == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
          cargo build --locked --release -p lspotify-cli --bin lspotify
          mkdir -p dist
          cp target/release/lspotify dist/lspotify-linux-x86_64
          cp scripts/install/install.sh dist/install.sh
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          chmod +x dist/lspotify-linux-x86_64 dist/install.sh

      - name: Build macOS release
        if: matrix.id == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          rustup target add x86_64-apple-darwin aarch64-apple-darwin

          cargo build \
            --locked \
            --release \
            --target x86_64-apple-darwin \
            -p lspotify-cli \
            --bin lspotify

          cargo build \
            --locked \
            --release \
            --target aarch64-apple-darwin \
            -p lspotify-cli \
            --bin lspotify

          mkdir -p dist

          cp \
            target/x86_64-apple-darwin/release/lspotify \
            dist/lspotify-macos-x86_64

          cp \
            target/aarch64-apple-darwin/release/lspotify \
            dist/lspotify-macos-aarch64

          chmod +x \
            dist/lspotify-macos-x86_64 \
            dist/lspotify-macos-aarch64

      - name: Build Windows release
        if: matrix.id == 'windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Windows Rust target.' }

          cargo build `
            --locked `
            --release `
            --target x86_64-pc-windows-msvc `
            -p lspotify-cli `
            --bin lspotify
          if ($LASTEXITCODE -ne 0) { throw 'Could not build lspotify.' }

          cargo build `
            --locked `
            --release `
            --target x86_64-pc-windows-msvc `
            -p lspotify-player-host
          if ($LASTEXITCODE -ne 0) { throw 'Could not build lspotify-player-host.' }

          $reported = & target/x86_64-pc-windows-msvc/release/lspotify.exe --version
          if ($reported -ne "lspotify $env:RELEASE_VERSION") {
            throw "CLI reports '$reported' instead of lspotify $env:RELEASE_VERSION."
          }

          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX.' }

          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not install cargo-cyclonedx.' }

          New-Item -ItemType Directory -Force dist/portable | Out-Null

          $built = 'target/x86_64-pc-windows-msvc/release'

          Copy-Item "$built/lspotify.exe" dist/portable/
          Copy-Item "$built/lspotify-player-host.exe" dist/portable/
          Copy-Item packaging/windows/portable/README.txt dist/portable/

          Copy-Item "$built/lspotify.exe" dist/lspotify-windows-x86_64.exe

          Compress-Archive `
            -Path dist/portable/* `
            -DestinationPath "dist/lspotify-$env:RELEASE_TAG-windows-x64-portable-unsigned.zip"

          wix build `
            packaging/windows/wix/Package.wxs `
            -arch x64 `
            -d "SourceDir=$built" `
            -d "ProductVersion=$env:RELEASE_VERSION" `
            -o "dist/lspotify-$env:RELEASE_TAG-windows-x64-unsigned.msi"

          if ($LASTEXITCODE -ne 0) { throw 'WiX could not build the MSI.' }

          ./scripts/generate-windows-sboms.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -OutputDir dist

          Copy-Item scripts/install/install.ps1 dist/install.ps1
          Copy-Item scripts/install/install.cmd dist/install.cmd

          Remove-Item dist/portable -Recurse -Force

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event.pull_request.merged == true
    needs:
      - version
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          expected=(
            "lspotify-linux-x86_64"
            "lspotify-macos-x86_64"
            "lspotify-macos-aarch64"
            "lspotify-windows-x86_64.exe"
            "lspotify-${RELEASE_TAG}-windows-x64-portable-unsigned.zip"
            "lspotify-${RELEASE_TAG}-windows-x64-unsigned.msi"
            "lspotify-${RELEASE_TAG}-cli.cdx.json"
            "lspotify-${RELEASE_TAG}-player-host.cdx.json"
            "install.ps1"
            "install.cmd"
            "install.sh"
            "THIRD_PARTY_NOTICES.md"
          )

          for file in "${expected[@]}"; do
            test -f "dist/$file" || {
              echo "::error::Missing release asset: $file"
              exit 1
            }
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          for file in *; do
            [[ "$file" == "checksums.txt" ]] && continue
            [[ "$file" == "SHA256SUMS.txt" ]] && continue
            sha256sum "$file"
          done | sort -k2 > checksums.txt

          cp checksums.txt SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --target "$RELEASE_SHA" \
              --title "lspotify $RELEASE_TAG" \
              --notes "lspotify $RELEASE_TAG release." \
              --latest
          fi
