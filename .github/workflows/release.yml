name: Release artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Wait for earlier main CI runs
        uses: actions/github-script@v8
        with:
          script: |
            const current = Number(process.env.GITHUB_RUN_NUMBER);
            const deadline = Date.now() + 90 * 60 * 1000;
            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                per_page: 100,
              });
              const earlier = runs.filter(run =>
                run.run_number < current && run.event === 'push' &&
                run.head_branch === 'main' && run.status !== 'completed');
              if (earlier.length === 0) break;
              if (Date.now() >= deadline) {
                throw new Error('Timed out waiting for earlier release runs');
              }
              core.info(`Waiting for ${earlier.length} earlier release run(s)`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Choose next version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch release tags.' }

          $existing = @(git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_.Substring(1)) } -Descending | Select-Object -First 1)
          if ($existing.Count -gt 0) {
            $published = gh release view $existing[0] --json assets,isDraft 2>$null
            if ($LASTEXITCODE -eq 0) {
              $release = $published | ConvertFrom-Json
              $expected = @(
                "lspotify-$($existing[0])-windows-x64-unsigned.msi",
                "lspotify-$($existing[0])-windows-x64-portable-unsigned.zip",
                "lspotify-$($existing[0])-cli.cdx.json",
                "lspotify-$($existing[0])-player-host.cdx.json",
                'lspotify-windows-x86_64.exe',
                'lspotify-linux-x86_64',
                'lspotify-macos-x86_64',
                'lspotify-macos-aarch64',
                'install.ps1', 'install.cmd', 'checksums.txt', 'SHA256SUMS.txt'
              )
              $assetNames = @($release.assets | ForEach-Object { $_.name })
              if (-not $release.isDraft -and @($expected | Where-Object { $_ -notin $assetNames }).Count -eq 0) {
                'skip=true' >> $env:GITHUB_OUTPUT
                Write-Host "Release $($existing[0]) is already complete for this commit."
                exit 0
              }
            }
            $tag = $existing[0]
            $newestTag = git tag -l 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]($_.Substring(1)) } -Descending | Select-Object -First 1
            if ([version]$newestTag.Substring(1) -gt [version]$tag.Substring(1)) {
              'skip=true' >> $env:GITHUB_OUTPUT
              Write-Host 'A newer version already exists; skipping this older retry.'
              exit 0
            }
          } else {
            $tags = @(git tag -l 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]($_.Substring(1)) } -Descending)
            $latest = if ($tags.Count -gt 0) { $tags[0] } else { $null }
            if ($latest) {
              git merge-base --is-ancestor $latest HEAD
              if ($LASTEXITCODE -ne 0) {
                'skip=true' >> $env:GITHUB_OUTPUT
                Write-Host 'A newer main commit already has a release; skipping this older rerun.'
                exit 0
              }

              $lastVersion = [version]$latest.Substring(1)
              if ($lastVersion -lt [version]'0.1.0') {
                $nextVersion = [version]'0.1.0'
              } elseif ($lastVersion.Build -lt 65535) {
                $nextVersion = [version]::new($lastVersion.Major, $lastVersion.Minor, $lastVersion.Build + 1)
              } elseif ($lastVersion.Minor -lt 255) {
                $nextVersion = [version]::new($lastVersion.Major, $lastVersion.Minor + 1, 0)
              } else {
                $nextVersion = [version]::new($lastVersion.Major + 1, 0, 0)
              }
            } else {
              $nextVersion = [version]'0.1.0'
            }

            if ($nextVersion.Major -gt 255) { throw 'MSI version range is exhausted.' }
            $tag = "v$nextVersion"
          }
          'skip=false' >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

  build-linux:
    name: Build Linux binary
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Build lspotify Linux binary
        env:
          LSPOTIFY_VERSION: ${{ needs.version.outputs.number }}
        run: |
          cargo build --locked --release -p lspotify-cli --bin lspotify
          mkdir -p dist
          cp target/release/lspotify dist/lspotify-linux-x86_64
          chmod +x dist/lspotify-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: lspotify-linux-x86_64
          path: dist/lspotify-linux-x86_64

  build-macos:
    name: Build macOS binaries
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Build lspotify macOS binaries
        env:
          LSPOTIFY_VERSION: ${{ needs.version.outputs.number }}
        run: |
          cargo build --locked --release --target x86_64-apple-darwin -p lspotify-cli --bin lspotify
          cargo build --locked --release --target aarch64-apple-darwin -p lspotify-cli --bin lspotify
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/lspotify dist/lspotify-macos-x86_64
          cp target/aarch64-apple-darwin/release/lspotify dist/lspotify-macos-aarch64
          chmod +x dist/lspotify-macos-x86_64 dist/lspotify-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: lspotify-macos
          path: dist/lspotify-macos-*

  windows-release:
    name: Package and publish release
    needs: [version, build-linux, build-macos]
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Windows executables
        env:
          LSPOTIFY_VERSION: ${{ needs.version.outputs.number }}
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p lspotify-cli --bin lspotify
          cargo build --locked --release --target x86_64-pc-windows-msvc -p lspotify-player-host

      - name: Check release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          $reported = & target/x86_64-pc-windows-msvc/release/lspotify.exe --version
          if ($reported -ne "lspotify $env:RELEASE_VERSION") {
            throw "The CLI reports '$reported' instead of release version $env:RELEASE_VERSION."
          }

      - name: Install packaging tools
        run: |
          dotnet tool install --global wix --version 4.0.6
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Could not install cargo-cyclonedx.' }

      - uses: actions/download-artifact@v4
        with:
          name: lspotify-linux-x86_64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: lspotify-macos
          path: dist

      - name: Package release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          $built = 'target/x86_64-pc-windows-msvc/release'
          Copy-Item "$built/lspotify.exe" dist/portable/
          Copy-Item "$built/lspotify.exe" dist/lspotify-windows-x86_64.exe
          Copy-Item "$built/lspotify-player-host.exe" dist/portable/
          Copy-Item packaging/windows/portable/README.txt dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/lspotify-$env:RELEASE_TAG-windows-x64-portable-unsigned.zip"

          wix build packaging/windows/wix/Package.wxs -arch x64 -d "SourceDir=$built" -d "ProductVersion=$env:RELEASE_VERSION" -o "dist/lspotify-$env:RELEASE_TAG-windows-x64-unsigned.msi"
          if ($LASTEXITCODE -ne 0) { throw 'WiX could not build the MSI.' }
          ./scripts/generate-windows-sboms.ps1 -ReleaseTag $env:RELEASE_TAG -OutputDir dist
          Copy-Item install.ps1, install.cmd dist/
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/checksums.txt -Encoding ascii
          Copy-Item dist/checksums.txt dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lspotify-${{ needs.version.outputs.tag }}-release-artifacts
          path: dist/*

      - name: Reserve release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            git tag $env:RELEASE_TAG HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push the release tag.' }
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $notes = "lspotify $env:RELEASE_TAG release. Multi-platform terminal Spotify client."
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'No release assets were packaged.' }
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:RELEASE_SHA --title "lspotify $env:RELEASE_TAG" --notes $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub release.' }
